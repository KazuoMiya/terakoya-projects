# 課題6: Nginx の設定（リバースプロキシ）
# Project 6: Nginx configuration (reverse proxy)
#
# 置き場所と有効化:
# Install and enable:
#   sudo cp deploy/nginx-terakoya-api.conf /etc/nginx/sites-available/terakoya-api
#   sudo ln -s /etc/nginx/sites-available/terakoya-api /etc/nginx/sites-enabled/terakoya-api
#   sudo rm /etc/nginx/sites-enabled/default        # ★外さないと既定サイトが全部受け取り /health が404になる
#                                                   # ★Without removing this, the default site takes everything and /health returns 404
#   sudo nginx -t                                    # ★設定の文法チェック。反映の前に必ず
#                                                    # ★Syntax check of the config. Always run before applying
#   sudo systemctl reload nginx                      # 落とさずに設定だけ読み直す
#                                                    # Reload just the config without downtime
#
# 役割: 80番（玄関）で受けて、127.0.0.1:8000（うちのAPI）へ取り次ぐ。
# APIを直接外に出さず Nginx を前に立てるのは、TLS・ログ・複数アプリの同居を
# 玄関一か所で面倒みるためだ（インフラ基礎で見た Web/AP の分担の実物）。
# Role: receive on port 80 (the front door) and forward to 127.0.0.1:8000
# (our API). We put Nginx in front instead of exposing the API directly so
# that TLS, logging, and multiple co-hosted apps are all handled at one
# front door (the real-life version of the Web/AP split from infra basics).

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        # 取り次ぐときに「元の依頼主が誰か」を添える決まり文句
        # The standard lines that attach "who the original requester was" when forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

